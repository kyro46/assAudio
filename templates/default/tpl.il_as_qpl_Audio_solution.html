<p>{QUESTIONTEXT}</p>
<br/>
<!-- BEGIN result_output -->
<div class="ass-audio-solution">
    <input
        type="hidden"
        class="ass-audio-solution-data"
        value='{RESULT_OUTPUT}'
    />
    <audio
        class="ass-audio-solution-player"
        controls
        preload="metadata"
        type="audio/webm">
    </audio>
    <br/>
    <a
        class="ass-audio-solution-download"
        download="audio-solution.webm">
    </a>
</div>
<script>
(function () {

    function initializeAudioSolutions() {

        document.querySelectorAll(
            '.ass-audio-solution'
        ).forEach(function (container) {

            // Bereits initialisierte Player überspringen
            if (container.dataset.audioInitialized === 'true') {
                return;
            }

            var dataElement = container.querySelector(
                '.ass-audio-solution-data'
            );

            var player = container.querySelector(
                '.ass-audio-solution-player'
            );

            var downloadLink = container.querySelector(
                '.ass-audio-solution-download'
            );

            if (!dataElement || !player || !downloadLink) {
                return;
            }

            var base64 = dataElement.value;

            if (!base64 || !base64.trim()) {
                return;
            }

            try {

                // Base64 in Binärdaten umwandeln
                var raw = window.atob(base64.trim());

                var binary = new Uint8Array(raw.length);

                for (var i = 0; i < raw.length; i++) {
                    binary[i] = raw.charCodeAt(i);
                }

                // Blob erzeugen
                var blob = new Blob(
                    [binary],
                    { type: 'audio/webm' }
                );

                var mediaURL = URL.createObjectURL(blob);

                // Player initialisieren
                player.src = mediaURL;
                player.load();

                // Download-Link initialisieren
                downloadLink.href = mediaURL;
				var rand = Math.floor(Math.random() * 10000000);
				var name = 'media_' + rand + '_{ID}.webm';
				
				downloadLink.textContent = 'Download';
				downloadLink.download = name;

                container.dataset.audioInitialized = 'true';

            } catch (error) {

                console.error(
                    'assAudio: Fehler bei der Audioinitialisierung:',
                    error
                );

            }

        });

    }

    // Funktion unabhängig vom Ladezeitpunkt aufrufen
    if (document.readyState === 'loading') {

        document.addEventListener(
            'DOMContentLoaded',
            initializeAudioSolutions
        );

    } else {

        initializeAudioSolutions();

    }

})();
</script>
<!-- END result_output -->
